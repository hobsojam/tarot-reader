sonar.organization=hobsojam
sonar.projectKey=hobsojam_tarot-reader

sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Card entries deliberately share a consistent record shape: this is curated deck
# content, not repeated application logic, so it is excluded from duplication analysis.
sonar.cpd.exclusions=src/data/cards.ts
