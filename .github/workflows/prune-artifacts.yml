name: Prune old build artifacts

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prune-build-artifacts
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify retention policy
        run: node --test .github/scripts/prune-artifacts.check.cjs
      - name: Delete artifacts from older builds
        uses: actions/github-script@v9
        with:
          script: |
            const { planArtifactDeletions } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-artifacts.cjs`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const [runs, artifacts] = await Promise.all([
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 }),
            ]);
            const toDelete = planArtifactDeletions(runs, artifacts);
            core.info(`Found ${artifacts.length} artifacts; deleting ${toDelete.length} from older CI and Pages builds.`);
            for (const artifact of toDelete) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted ${artifact.name} from run ${artifact.workflow_run.id} (${artifact.size_in_bytes} bytes).`);
            }
