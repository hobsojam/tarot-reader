name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run images:check
      - run: npm test
      - run: node --test .github/scripts/prune-artifacts.check.cjs
      - run: npm run build
      - run: npm run test:e2e -- --reporter=dot,html
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          # The HTML report already includes screenshots, diffs, and traces.
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  sonar:
    # Dependabot PRs cannot read SONAR_TOKEN, so the scan would always fail.
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
